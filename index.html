<script>
    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Earth's radius in km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    function getLocation(){
        if(navigator.geolocation){
            document.getElementById('msg').innerHTML = "getting location..."
            navigator.geolocation.getCurrentPosition(showPosition, showError);
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }else{
            alert("Geolocation is not supported!");
        }
    }

    function showPosition(position){
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        document.getElementById("lat").value = lat;
        document.getElementById("long").value = lon;
        document.getElementById('msg').innerHTML=''
    }

    function showError(error){
        switch(error.code){
            case error.PERMISSION_DENIED: alert("Denied permission!"); break;
            case error.POSITION_UNAVAILABLE: alert("Location info is not available!"); break;
            case error.TIMEOUT: alert("Request timedout!"); break;
            case error.UNKNOWN_ERROR: alert("Unknown error occured!"); break;
        }
    }

    const win = document.getElementById("window");
    const stop_btn = document.getElementById("s_btn");
    const start_btn = document.getElementById("btn");

    let isTracking = false;

    const overhead = document.getElementById('co');
    const app_count = document.getElementById('ca');
    const leaving = document.getElementById('cs');

    document.getElementById("btn").addEventListener("click", async (e)=>{
        e.preventDefault();

        const userLat = document.getElementById("lat").value;
        const userLon = document.getElementById("long").value;
        const kmr = document.getElementById("kmr").value;

        if(userLat==='' || userLon==='' || kmr===''){
            alert("all fields are required!");
            return;
        }
        if (isTracking) return;

        isTracking = true;
        start_btn.disabled = true;
        stop_btn.style.display = "block";
        stop_btn.disabled = false;

        win.value = '';
        win.value += `\nDetecting plane within ${kmr} km range....\n`;

        while(isTracking === true){
            document.getElementById('ld').innerHTML = 'Live data...';

            const latitude = parseFloat(userLat);
            const longitude = parseFloat(userLon);
            const radiusKm = parseFloat(kmr);
            
            // ADSB.lol requires Nautical Miles (NM)
            const radiusNM = Math.round(radiusKm * 0.539957);

            const url = `https://api.adsb.lol/v2/lat/${latitude}/lon/${longitude}/dist/${radiusNM}`;

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const data = await response.json();
                const planes = data.ac || [];

                if (planes.length === 0) {
                    win.value += `\nNo planes found in the area.\n`;
                    document.getElementById('planeList').innerHTML = '';
                } else {
                    win.value += `\n${planes.length} plane(s) detected:\n`;

                    let counts = [0, 0, 0]; // Overhead, Approaching, Surrounding
                    let htmlbuffer = '';
                    let logbuffer = '';

                    planes.forEach((p, index) => {
                        // ADSB.lol already filters by radiusNM, but we check distance in KM for your logic
                        const dist = getDistance(latitude, longitude, p.lat, p.lon);
                        
                        // Convert Altitude from Feet to Meters
                        const altMeters = p.alt_baro ? Math.round(p.alt_baro * 0.3048) : "N/A";
                        const callsign = p.flight?.trim() || "N/A";
                        const country = p.t || "Unknown"; // 't' is often used for type/desc or reg

                        let category = "";
                        let cardClass = "";
                        let headerText = "";

                        if (dist < 5) {
                            counts[0]++;
                            category = "overhead";
                            cardClass = "overhead-card";
                            headerText = "✈️ Overhead";
                        } else if (dist <= 15) {
                            counts[1]++;
                            category = "app";
                            cardClass = "app-card";
                            headerText = "✈️ Approaching";
                        } else {
                            counts[2]++;
                            category = "surr";
                            cardClass = "surr-card";
                            headerText = "✈️ Surrounding";
                        }

                        htmlbuffer += `
                            <div class="plane-card ${cardClass}">
                                <div class="plane-header-${category}">
                                    ${headerText}
                                </div>
                                <div class="plane-row"><span>ICAO24:</span> ${p.hex.toUpperCase()}</div>
                                <div class="plane-row"><span>Callsign:</span> ${callsign}</div>
                                <div class="plane-row"><span>Country:</span> ${country}</div>
                                <div class="plane-row"><span>Latitude:</span> ${p.lat}</div>
                                <div class="plane-row"><span>Longitude:</span> ${p.lon}</div>
                                <div class="plane-row"><span>Distance:</span> ${dist.toFixed(2)} km</div>
                                <div class="plane-row"><span>Altitude:</span> ${altMeters} m</div>
                            </div>`;

                        logbuffer += `\nPlane #${index + 1}: ICAO24: ${p.hex} | Callsign: ${callsign} | Dist: ${dist.toFixed(1)}km | Alt: ${altMeters}m`;
                    });

                    document.getElementById('planeList').innerHTML = htmlbuffer;
                    win.value += logbuffer;

                    overhead.innerHTML = `Overhead ( <=5 km) <br><br> ${counts[0]}`;
                    app_count.innerHTML = `Approaching ( <=15 km) <br><br> ${counts[1]}`;
                    leaving.innerHTML = `Surrounding ( >15 km) <br><br> ${counts[2]}`;
                }

                win.scrollTop = win.scrollHeight;

            } catch (err) {
                win.value += `\nError fetching data: ${err.message}\n`;
                console.error(err);
            }

            // Wait 10 seconds before next poll
            await new Promise(resolve => setTimeout(resolve, 10000));
        }
    });

    stop_btn.addEventListener('click', ()=>{
        document.getElementById('ld').innerHTML = 'detection stopped...';
        isTracking = false;
        start_btn.disabled = false;
        stop_btn.disabled = true;
        win.value += "\n\nTracking stopped....\n";
        win.scrollTop = win.scrollHeight;
    });
</script>

<footer class="footer">

</footer>

                // const response = await fetch(API_URL);
                // const result = await response.json();
    
                // const planes = result.states;

                const radiusNM = Math.round(parseFloat(kmr) * 0.539957);
                document.getElementById("nms").value=radiusNM;
                const url = `https://detectplanesapi.onrender.com/planes?lat=${latitude}&lon=${longitude}&range=${radiusNM}`;
                
                // NEW PROXY: cleaner and more reliable
                //const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(target)}`;

                const res = await fetch(url);
                
                const data = await res.json();
                const planes = data.ac || [];

                // win.value+=`\n${result.states}\n`;
                

                if (!planes || planes.length === 0 || data.total === 0) {
                    win.value += `\nNo planes found in the area.\n`;

                    document.getElementById('planeList').innerHTML='';
                    document.getElementById('ld').innerHTML=''
                    document.getElementById('ld').innerHTML=`Live data... <br><br> No planes found in the area. `

                    overhead.innerHTML=`Overhead ( <=5 km) <br><br> ${0}`
                    
                    app.innerHTML=`Approaching ( <=15 km) <br><br> ${0}`
                    
                    leaving.innerHTML=`Surrounding ( >15 km and <=${kmr}) <br><br> ${0}`

                } else {
                    win.value += `\n${planes.length || data.total} plane(s) detected:\n\n`;

                    document.getElementById('ld').innerHTML=''
                    document.getElementById('ld').innerHTML=`Live data... <br><br> ${planes.length || data.total} plane(s) detected: `


                    let array = [0,0,0]
                    document.getElementById('planeList').innerHTML='';
                    // document.getElementById('planeList').innerHTML='Live Data...';
                    planes.forEach((plane, index) => {
                        //const dist = getDistance(latitude, longitude, plane.lat, plane.lon);
                        const dist = Math.round(parseFloat(plane.dst) / 0.539957);

                        // if (dist < 2) { // If plane is within 2km
                        //     new Notification("Plane Overhead!", {
                        //         body: `Flight ${plane[1]} is only ${dist.toFixed(1)}km away!`,
                        //         icon: "airplane-icon.png" 
                        //     });
                        // }

                        // if (dist < 10) { // If plane is within 15km
                        //     new Notification("Plane Approaching!", {
                        //         body: `Flight ${plane[1]} is only ${dist.toFixed(1)}km away!`,
                        //         icon: "airplane-icon.png" 
                        //     });
                        // }

                        if(dist<5){
                            array[0]++;
                            // document.getElementById('planeList').innerHTML+=`
                            // <div class="plane-card" style="border: 2px solid var(--green);">
                            //     <h4>Overhead</h4>
                            //     \nICAO24: ${plane[0]} \t Callsign: ${plane[1]?.trim() || "N/A"} \t Country: ${plane[2]} \t Country: ${plane[2]} \t Latitude: ${plane[6]} \t Longitude: ${plane[5]} \t Distance: ${dist}km \t Altitude: ${plane[7]} m\n
                            // </div>
                            // `

                            document.getElementById('planeList').innerHTML += `
                            <div class="plane-card overhead-card">
                                <div class="plane-header-overhead">
                                    ✈️ Overhead
                                </div>

                                <div class="plane-row"><span>ICAO24:</span> ${plane.hex.toUpperCase()}</div>
                                <div class="plane-row"><span>Flight:</span> ${plane.flight?.trim() || "N/A"}</div>
                                <div class="plane-row"><span>Country:</span> ${plane.t || "Unknown"}</div>
                                <div class="plane-row"><span>Latitude:</span> ${plane.lat}</div>
                                <div class="plane-row"><span>Longitude:</span> ${plane.lon}</div>
                                <div class="plane-row"><span>Distance:</span> ${dist.toFixed(2)} km</div>
                                <div class="plane-row"><span>Altitude:</span> ${plane.alt_baro ? Math.round(plane.alt_baro * 0.3048) : "N/A"} m</div>
                            </div>
                            `;
                        }
                        else if(dist<=15){
                            array[1]++;

                            // document.getElementById('planeList').innerHTML+=`
                            // <div class="plane-card" style="border: 2px solid var(--yellow);">
                            //     <h4>Approaching</h4>
                            //     \nICAO24: ${plane[0]} \t Callsign: ${plane[1]?.trim() || "N/A"} \t Country: ${plane[2]} \t Country: ${plane[2]} \t Latitude: ${plane[6]} \t Longitude: ${plane[5]} \t Distance: ${dist}km \t Altitude: ${plane[7]} m\n
                            // </div>
                            // `

                            document.getElementById('planeList').innerHTML += `
                            <div class="plane-card app-card">
                                <div class="plane-header-app">
                                    ✈️ Approaching
                                </div>

                                <div class="plane-row"><span>ICAO24:</span> ${plane.hex.toUpperCase()}</div>
                                <div class="plane-row"><span>Flight:</span> ${plane.flight?.trim() || "N/A"}</div>
                                <div class="plane-row"><span>Country:</span> ${plane.t || "Unknown"}</div>
                                <div class="plane-row"><span>Latitude:</span> ${plane.lat}</div>
                                <div class="plane-row"><span>Longitude:</span> ${plane.lon}</div>
                                <div class="plane-row"><span>Distance:</span> ${dist.toFixed(2)} km</div>
                                <div class="plane-row"><span>Altitude:</span> ${plane.alt_baro ? Math.round(plane.alt_baro * 0.3048) : "N/A"} m</div>
                            </div>
                            `;
                        }
                        else{
                            array[2]++;
                            // document.getElementById('planeList').innerHTML+=`
                            // <div class="plane-card" style="border: 2px solid var(--red);">
                            //     <h4>Surrounding</h4>
                            //     \nICAO24: ${plane[0]} \t Callsign: ${plane[1]?.trim() || "N/A"} \t Country: ${plane[2]} \t Country: ${plane[2]} \t Latitude: ${plane[6]} \t Longitude: ${plane[5]} \t Distance: ${dist}km \t Altitude: ${plane[7]} m\n
                            // </div>
                            // `

                            document.getElementById('planeList').innerHTML += `
                            <div class="plane-card surr-card">
                                <div class="plane-header-surr">
                                    ✈️ Surrounding
                                </div>

                                <div class="plane-row"><span>ICAO24:</span> ${plane.hex.toUpperCase()}</div>
                                <div class="plane-row"><span>Flight:</span> ${plane.flight?.trim() || "N/A"}</div>
                                <div class="plane-row"><span>Country:</span> ${plane.t || "Unknown"}</div>
                                <div class="plane-row"><span>Latitude:</span> ${plane.lat}</div>
                                <div class="plane-row"><span>Longitude:</span> ${plane.lon}</div>
                                <div class="plane-row"><span>Distance:</span> ${dist.toFixed(2)} km</div>
                                <div class="plane-row"><span>Altitude:</span> ${plane.alt_baro ? Math.round(plane.alt_baro * 0.3048) : "N/A"} m</div>
                            </div>
                            `;
                        }
                        win.value += `\nPlane #${index + 1}: ICAO24: ${plane.hex.toUpperCase()} | Flight: ${plane.flight?.trim() || "N/A"} | Country: ${plane.t || "Unknown"} | Latitude: ${plane.lat} | Longitude: ${plane.lon} | Distance: ${dist.toFixed(2)}km | Altitude: ${plane.alt_baro ? Math.round(plane.alt_baro * 0.3048) : "N/A"} m\n`;


                
                    });
                    

                    overhead.innerHTML=''
                    overhead.innerHTML=`Overhead ( <=5 km) <br><br> ${array[0]}`
                    app.innerHTML=''
                    app.innerHTML=`Approaching ( <=15 km) <br><br> ${array[1]}`
                    leaving.innerHTML=''
                    leaving.innerHTML=`Surrounding ( >15 km and <=${kmr}) <br><br> ${array[2]}`
                }
                
                win.scrollTop = win.scrollHeight;
                
                await new Promise(resolve => setTimeout(resolve, 10000));
            }
    }
    })

    stop_btn.addEventListener('click', ()=>{

        // overhead.innerHTML='Overhead'
        
        // app.innerHTML='Approaching'
        
        // leaving.innerHTML='Surrounding'
        
        document.getElementById('ld').innerHTML=''
        document.getElementById('ld').innerHTML='detection stopped...'
        isTracking=false
        start_btn.disabled=false;
        stop_btn.disabled=true;
        win.value+= "\n\nTracking stopped....\n";
        win.scrollTop = win.scrollHeight;
    })


</script>
